server:
  port: 2080
  servlet:
    context-path: /api

spring:
  application:
    name: digital-read-backend
  datasource:
    url: jdbc:mysql://localhost:3306/digital_read?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: digital_read_2024_accessibility_secret_key_very_long_and_secure_abcdefghijklmnopqrstuvwxyz
  expiration: 86400000

logging:
  level:
    com.digitalread: DEBUG
    org.springframework.web: INFO
